name: Nightly Tests, Mutation & Load Testing

on:
  schedule:
    # Runs every night at 01:00 UTC.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ###########################################################################
  # Full test suite — unit + integration + E2E across Node 18/20/22.
  # fail-fast: false so every matrix combination runs even if one fails.
  ###########################################################################
  full-test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Serve the app for E2E tests
        run: |
          python3 -m http.server 8000 > /tmp/nightly-e2e-server.log 2>&1 &
          sleep 2

      - name: Run full test suite with coverage
        run: |
          mkdir -p vitest-results
          npx vitest run --coverage \
            --reporter=junit \
            --reporter-options outputFile=vitest-results/full-${{ matrix.node-version }}.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-${{ matrix.node-version }}
          path: coverage/
          retention-days: 30

      - name: Upload nightly test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-${{ matrix.node-version }}
          path: vitest-results/full-${{ matrix.node-version }}.xml
          retention-days: 30

  ###########################################################################
  # Mutation testing — StrykerJS.
  # Requires a stryker.conf.js in the repository root; runs with
  # continue-on-error so a missing config never blocks the nightly run.
  ###########################################################################
  mutation-testing:
    name: Mutation Testing (StrykerJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker mutation testing
        continue-on-error: true
        run: npx stryker run

      - name: Upload mutation testing report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: stryker-reports/
          retention-days: 30

  ###########################################################################
  # Load testing — autocannon smoke load test against a locally served build.
  # Runs with continue-on-error; results are attached to the run for review.
  ###########################################################################
  load-testing:
    name: Load Testing (autocannon)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Serve the app and run load test
        continue-on-error: true
        run: |
          python3 -m http.server 8000 > /tmp/nightly-load-server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          npx autocannon -c 50 -d 30s http://localhost:8000 | tee load-test-results.txt || true
          kill "$SERVER_PID" 2>/dev/null || true

      - name: Upload load test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            load-test-results.txt
            /tmp/nightly-load-server.log
          retention-days: 15